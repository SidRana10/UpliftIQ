[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upliftiq"
version = "0.1.0"
description = "Causal ML and decision intelligence platform on the Hillstrom and corrected Criteo uplift datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "scikit-learn>=1.4",
    "lightgbm>=4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
upliftiq-download = "upliftiq.data.download:main"
upliftiq-validate = "upliftiq.data.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "network: tests that need network access or a downloaded dataset",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Markdown report template contains long prose lines.
"src/upliftiq/evaluation/hillstrom_report.py" = ["E501"]
"src/upliftiq/modeling/select_report.py" = ["E501"]
"src/upliftiq/evaluation/final_report.py" = ["E501"]
